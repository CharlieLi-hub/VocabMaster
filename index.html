  .filters::-webkit-scrollbar { display: none; }
  .chip { flex: none; }

  .actions .btn { white-space: normal; min-height: 42px; font-size: 12px; padding: 9px 7px; }

  .face { padding: 15px; border-radius: 19px; }
  .headword { font-size: clamp(30px, 9vw, 45px); }

  .statgrid { grid-template-columns: repeat(3,minmax(0,1fr)); gap: 6px; }
  .stat { padding: 12px 4px; border-radius: 12px; font-size: 12px; }
  .stat strong { font-size: 23px; }

  .quizword { margin: 12px 0 18px; }
  .modalback { align-items: flex-end; padding: 0; }

  .toast { bottom: calc(83px + env(safe-area-inset-bottom)); }
  footer { padding-bottom: 12px; }
}

 <div class="field" style="margin-top:17px"><label>Gemini API Key（本次開啟有效）</label><input type="password" id="apikey-input" autocomplete="off" placeholder="${apiKey?'已設定金鑰；留空會沿用本次金鑰':'在此輸入 Google AI Studio 金鑰'}" value=""><div class="fine">基於安全，金鑰不會回填在輸入框中。留空按「確認設定」會沿用本次已輸入的金鑰。</div></div><div class="field"><label>AI 模型（依你的 API Key 可用範圍選擇）</label><select id="model-input">${[['gemini-3.8-flash','Gemini 3.8 Flash（建議預設）'],['gemini-3.7-flash','Gemini 3.7 Flash'],['gemini-3.6-flash','Gemini 3.6 Flash'],['gemini-3.5-flash-lite','Gemini 3.5 Flash-Lite（輕量）'],['gemini-3.5-flash','Gemini 3.5 Flash']].map(([id,label])=>`<option value="${id}" ${aiModel===id?'selected':''}>${label}</option>`).join('')}</select></div><div class="field"><label style="display:flex;align-items:center;gap:9px;cursor:pointer;font-size:13px"><input type="checkbox" id="fallback-input" ${aiFallback?'checked':''} style="width:17px;height:17px;accent-color:#8277e8"> 503／404 時自動重試或切換備援模型</label><div class="fine">預設開啟：先對所選模型有限次重試，仍無法使用時改試 Flash-Lite／Flash。成功時會顯示實際使用的模型；不會改動你的預設選擇。每次重試都算一次 API 呼叫。</div></div><div class="notice">Google API 503 代表服務暫時過載，會有限次重試；404 代表模型可能不對目前金鑰開放，會嘗試備援。遇到 429（頻率或免費額度限制）、403（權限）時不會自動重試。測試連線會發出一次或多次少量文字 API 請求。</div><p class="fine">在 <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener noreferrer">Google AI Studio</a> 取得 API Key。免費額度與可用模型依 Google 實際公告及你的專案方案而定。</p><div class="footactions"><button class="btn warn" data-action="forget-key">本次停用金鑰</button><div class="actions"><button class="btn" data-action="test-ai">測試連線</button><button class="btn" data-action="close-modal">取消</button><button class="btn primary" data-action="save-settings">確認設定</button></div></div></div></div>`;
 if(modal==='generate')return `<div class="modalback" data-backdrop="true"><div class="modal" role="dialog" aria-modal="true" aria-label="AI 生成單字"><div class="modalhead"><h2>AI 生成 20 個主題單字</h2><button class="iconbtn" data-action="close-modal">✕</button></div><div class="row2"><div class="field"><label for="generate-level">CEFR 等級</label><select id="generate-level">${['B1','B2','C1'].map(x=>`<option ${x===genLevel?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="generate-topic">主題類別</label><select id="generate-topic">${TOPIC_CATEGORIES.map(group=>`<optgroup label="${esc(group.group)}">${group.items.map(([value,label])=>`<option value="${esc(value)}" ${genTopic===value?'selected':''}>${esc(label)}</option>`).join('')}</optgroup>`).join('')}<option value="__custom__" ${genTopic==='__custom__'?'selected':''}>自訂主題（自行輸入）</option></select></div></div><div id="generate-custom-group" class="field ${genTopic==='__custom__'?'':'hidden'}"><label for="generate-custom-topic">自訂主題</label><input id="generate-custom-topic" type="text" maxlength="120" value="${esc(genCustomTopic)}" placeholder="例如：半導體、面試英文、攝影"><div class="fine">找不到想要的類別時，可以自行輸入中文或英文主題。</div></div><div class="notice">將產生約 20 個所選主題的實用單字，並自動略過單字庫中已存在的英文單字。AI 可能需要人工確認音標及解釋是否正確。</div><div class="footactions" style="margin-top:20px"><button class="btn" data-action="close-modal">取消</button><button class="btn primary" data-action="generate" ${busy?'disabled':''}>${busy?'產生中…':'開始生成'}</button></div></div></div>`;
 if(modal==='editor')return `<div class="modalback" data-backdrop="true"><div class="modal" role="dialog" aria-modal="true" aria-label="單字編輯"><div class="modalhead"><h2>${editId?'編輯單字':'新增英文單字'}</h2><button class="iconbtn" data-action="close-modal">✕</button></div><form id="word-form"><div class="row2"><div class="field"><label>英文單字 *</label><input name="word" type="text" required value="${esc(form.word)}" placeholder="e.g. Resilient"></div><div class="field"><label>中文意思 *</label><input name="meaning" type="text" required value="${esc(form.meaning)}" placeholder="e.g. 有韌性的"></div></div><div class="row3"><div class="field"><label>音標</label><input name="ipa" value="${esc(form.ipa)}"></div><div class="field"><label>詞性</label><select name="pos">${['noun','verb','adjective','adverb','phrase','other'].map(x=>`<option value="${x}" ${form.pos===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>等級</label><select name="level">${['B1','B2','C1'].map(x=>`<option ${form.level===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="field"><label>英文定義</label><textarea name="enDefinition" rows="2">${esc(form.enDefinition)}</textarea></div><div class="row2"><div class="field"><label>詞型變化</label><input name="forms" value="${esc(form.forms)}"></div><div class="field"><label>搭配用法</label><input name="usagePattern" value="${esc(form.usagePattern)}"></div></div><div class="field"><label>英文例句</label><textarea name="example" rows="2">${esc(form.example)}</textarea></div><div class="field"><label>例句中文翻譯</label><textarea name="exampleTranslation" rows="2">${esc(form.exampleTranslation)}</textarea></div><div class="footactions"><button type="button" class="btn purple" data-action="auto-fill" ${busy?'disabled':''}>${busy?'AI 補全中…':'✨ AI 自動填寫'}</button><div class="actions"><button type="button" class="btn" data-action="close-modal">取消</button><button class="btn primary" type="submit">${editId?'儲存修改':'新增單字'}</button></div></div></form></div></div>`;
 return '';
}
function render(){clamp();const w=current();document.getElementById('app').innerHTML=`<header><div class="top"><div class="brand"><div class="brandlogo">▣</div><div><strong>VocabMaster Pro</strong><div class="sub">PWA · 已儲存 ${data.words.length} 個單字 ${storageError?'· ⚠ 本次儲存失敗':''}</div></div></div><nav class="tabs" aria-label="主要功能">${[['card','單字卡'],['practice','AI 造句'],['quiz','測驗'],['stats','進度']].map(([id,name])=>`<button class="${tab===id?'active':''}" data-action="tab" data-value="${id}">${name}</button>`).join('')}</nav></div></header>
 <main class="container"><div class="toolbar"><div class="filters">${[['ALL',`全部 (${data.words.length})`],['B1','B1'],['B2','B2'],['C1','C1'],['BOOKMARKED',`★ 收藏 (${data.bookmarkedIds.length})`],['WRONG',`錯題 (${data.wrongIds.length})`]].map(([id,name])=>`<button class="chip ${level===id?'active':''}" data-action="level" data-value="${id}">${name}</button>`).join('')}</div><input id="search" class="search" type="search" placeholder="搜尋英文、中文或例句" aria-label="搜尋單字" value="${esc(search)}"></div>
 <div class="toolbar"><div class="actions"><button class="btn green" data-action="bulk" ${busy?'disabled':''}>＋ AI 擴充 30 個</button><button class="btn purple" data-action="generate-modal">✨ AI 生成 20 個</button><button class="btn primary" data-action="add">＋ 手動新增</button></div><div class="actions"><button class="btn" data-action="export">↓ 完整備份</button><button class="btn" data-action="import">↑ 匯入</button><button class="btn" data-action="settings">⚙ AI 設定</button></div></div>
 <div class="layout"><section class="mainpanel">${tab==='card'?buildCard(w):tab==='quiz'?buildQuiz(w):tab==='practice'?buildPractice(w):buildStats()}</section>${renderSidebar()}</div></main>
 <footer>VocabMaster Pro · iPhone／電腦皆可使用 · 資料儲存在目前裝置 · 建議定期匯出 JSON 備份</footer>${renderModal()}<input type="file" id="import-file" accept=".json,application/json" class="hidden">`;
}
function ensureKey(){if(apiKey.trim())return true;pendingModal=modal==='settings'?null:modal;notify('尚未設定金鑰：請在 AI 設定中輸入本次要使用的 Gemini API Key。',true);modal='settings';render();return false;}
// Google 503 = overloaded; retry with short, bounded exponential backoff.
// 404 on the selected model can be resolved by trying a currently listed model.
const delay=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function callGemini(system,user){
 if(!apiKey.trim())throw Error('尚未設定 Gemini API Key。');
 lastAiModelUsed=null;
 const preferred=aiModel;
 const candidates=[preferred];
 if(aiFallback)for(const id of ['gemini-3.5-flash-lite','gemini-3.6-flash'])if(!candidates.includes(id))candidates.push(id);
 let finalError=null;
 for(let route=0;route<candidates.length;route++){
  const model=candidates[route];
  const allowedAttempts=route===0?2:route===1?2:1;
  for(let attempt=0;attempt<allowedAttempts;attempt++){
   const controller=new AbortController();
   const timer=setTimeout(()=>controller.abort(),35000);
   try{
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{
     method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':apiKey.trim()},
     body:JSON.stringify({contents:[{parts:[{text:user}]}],systemInstruction:{parts:[{text:system}]},generationConfig:{responseMimeType:'application/json'}}),
     signal:controller.signal
    });
    const json=await r.json().catch(()=>({}));
    if(!r.ok){
     const detail=json?.error?.message||'未知 API 錯誤';
     if(r.status===503||r.status===500||r.status===502||r.status===504){
      finalError=Error(`Google API ${r.status}：伺服器目前忙碌。${detail}`);
      if(attempt<allowedAttempts-1){notify(`${model} 暫時繁忙，正在稍候重試（${attempt+1}/${allowedAttempts-1}）…`);await delay(950*Math.pow(2,attempt)+Math.floor(Math.random()*300));continue;}
      if(route<candidates.length-1){notify(`${model} 暫時繁忙，正在改試備援模型…`);break;}
      throw Error('Google API 503：Google 服務目前過載；'+(aiFallback?'已重試並嘗試備援模型':'已自動重試')+'，仍未成功。請過幾分鐘再試，或手動選擇 Gemini 3.5 Flash-Lite。');
     }
     if(r.status===404){
      finalError=Error(`Google API 404：${model} 對此帳號不可用。${detail}`);
      if(route<candidates.length-1){notify(`${model} 目前不可用，正在改試備援模型…`);break;}
      throw Error('Google API 404：'+(aiFallback?'所選模型及備援模型皆不可用。':'所選模型不可用。')+'請到 AI 設定選擇此帳號有權使用的模型。');
     }
     if(r.status===429)throw Error(`Google API 429：已達請求頻率或使用額度限制，不會自動重試。請稍後再試或查看 Google AI Studio 額度。${detail}`);
     if(r.status===403||r.status===401)throw Error(`Google API ${r.status}：金鑰或專案權限不足，請確認 Google AI Studio 設定。${detail}`);
     throw Error(`Google API ${r.status}：${detail}`);
    }
    const message=json?.candidates?.[0]?.content?.parts?.filter(p=>typeof p.text==='string').map(p=>p.text).join('');
    if(!message)throw Error('AI 未回傳文字，可能被內容安全機制阻擋。');
    let result;
    try{result=JSON.parse(message.replace(/^```(?:json)?\s*|\s*```$/g,''));}
    catch{throw Error('AI 回傳的內容不是有效 JSON，請重試。');}
    lastAiModelUsed=model;
    return result;
   }catch(e){
    if(e.name==='AbortError')throw Error(`AI 請求逾時（${model}），請確認網路後重試。`);
    if(e.name==='TypeError')throw Error('無法連線 Gemini API。請檢查網路、API Key 或瀏覽器跨來源限制。');
    throw e;
   }finally{clearTimeout(timer);}
  }
 }
 throw finalError||Error('沒有可用的 Gemini 模型。');
}
function usedModelLabel(){return lastAiModelUsed&&lastAiModelUsed!==aiModel?`（備援模型：${lastAiModelUsed}）`:'';}

async function testAIConnection(){
 const keyInput=$('#apikey-input'),modelInput=$('#model-input');
 if(!keyInput||!modelInput)return;
 if(keyInput.value.trim())apiKey=keyInput.value.trim();aiModel=modelInput.value;aiFallback=Boolean($('#fallback-input')?.checked);
 if(!apiKey){notify('沒有可使用的 API Key，請在此暫時輸入金鑰。',true);return;}
 if(busy)return;
 busy=true;const button=$('[data-action="test-ai"]');if(button){button.disabled=true;button.textContent='測試中…';}
 try{
   const result=await callGemini('Return a valid JSON object with exactly one key named ok and value true.','Connection test. Reply {"ok":true}.');
   if(result?.ok!==true)throw Error('模型有回應，但格式不符合預期；請再試一次。');
   notify(`連線成功：${lastAiModelUsed}。${usedModelLabel()?'已自動切換備援模型。':'現在可以使用 AI 造句、單字補全與批量生成。'}`);
 }catch(e){notify('測試失敗：'+e.message,true);}
 finally{busy=false;const b=$('[data-action="test-ai"]');if(b){b.disabled=false;b.textContent='測試連線';}}
}
function addGenerated(rows){if(!Array.isArray(rows))throw Error('AI 回應格式不是單字清單。');let count=0;const known=new Set(data.words.map(x=>x.word.toLocaleLowerCase()));const incoming=[];for(const row of rows){const w=normalizeWord({...row,id:uid()});if(!w)continue;const k=w.word.toLocaleLowerCase();if(known.has(k))continue;known.add(k);incoming.push(w);count++;}if(count){data.words=[...incoming,...data.words];index=0;level='ALL';search='';persist();}return count;}
async function bulkGenerate(){if(!ensureKey())return;busy=true;render();try{const result=await callGemini('You are an expert English teacher. Reply ONLY with a JSON array. Each item must contain word, ipa, pos, level (B1/B2/C1), meaning (Traditional Chinese), enDefinition, forms, usagePattern, example, exampleTranslation. Exactly 30 practical distinct B1-C1 English words. Avoid inflected duplicates.','Generate 30 diverse practical English vocabulary entries. Avoid these already-known words: '+data.words.slice(0,250).map(x=>x.word).join(', '));const n=addGenerated(result);notify(`AI 產生完成：實際新增 ${n} 個，已過濾重複單字。${usedModelLabel()}`);}
 catch(e){notify('AI 擴充失敗：'+e.message,true);}finally{busy=false;render();}}
async function topicGenerate(){genLevel=$('#generate-level').value;genTopic=$('#generate-topic').value;genCustomTopic=$('#generate-custom-topic')?.value||'';const topic=genTopic==='__custom__'?genCustomTopic.trim():genTopic;if(!topic){notify('請先輸入自訂主題。',true);$('#generate-custom-topic')?.focus();return;}if(!ensureKey())return;busy=true;render();try{const result=await callGemini('You are an expert CEFR vocabulary instructor. Reply ONLY with a JSON array of 20 objects, each containing word, ipa, pos, level, meaning (Traditional Chinese), enDefinition, forms, usagePattern, example, exampleTranslation. No duplicate words.','Generate 20 distinct CEFR '+genLevel+' practical English words about '+topic+'. Avoid: '+data.words.slice(0,250).map(x=>x.word).join(', '));const n=addGenerated(result);modal=null;notify(`已新增 ${n} 個主題單字（重複者略過）。${usedModelLabel()}`);}
 catch(e){notify('AI 生成失敗：'+e.message,true);}finally{busy=false;render();}}
async function analyze(){if(!ensureKey())return;const w=current(),input=$('#sentence-input');sentence=input?.value.trim()||'';if(!w||!sentence){notify('請先輸入一個英文句子。',true);return;}busy=true;feedback=null;const wordId=w.id;render();try{const result=await callGemini(`You are a careful English tutor evaluating a sentence with the target word ${w.word}. Reply ONLY JSON object with score (integer 1-10), feedback (Traditional Chinese), correctedSentence, improvedSentence. Give constructive and concrete feedback.`,`Target word: ${w.word}\nUser sentence: ${sentence}`);if(current()?.id!==wordId)return;feedback={score:Number(result.score)||0,feedback:safeText(result.feedback),correctedSentence:safeText(result.correctedSentence),improvedSentence:safeText(result.improvedSentence)};if(usedModelLabel())notify('AI 批改完成'+usedModelLabel());}
 catch(e){notify('AI 批改失敗：'+e.message,true);}finally{busy=false;render();}}
async function autoFill(){form=getEditorForm();if(!ensureKey())return;const f=form;if(!f.word){notify('請先填入英文單字。',true);return;}form=f;busy=true;render();try{const result=await callGemini('You are an English dictionary editor. Reply ONLY with one JSON object containing ipa, pos, level (B1/B2/C1), meaning (Traditional Chinese), enDefinition, forms, usagePattern, example, exampleTranslation. Do not include extra keys.','Supply accurate dictionary details for English word: '+f.word);form={...form,...Object.fromEntries(Object.keys(DEFAULT_FORM()).filter(k=>k!=='word').map(k=>[k,safeText(result[k]||form[k])]))};notify('AI 已補上單字資料，請檢查後儲存。'+usedModelLabel());}
 catch(e){notify('AI 自動填寫失敗：'+e.message,true);}finally{busy=false;render();}}
// All UI actions are delegated from the document to survive re-renders.
document.addEventListener('click',e=>{
 const btn=e.target.closest('[data-action]');if(!btn){if(e.target.hasAttribute('data-backdrop'))closeModal();return;}
 const action=btn.dataset.action;
 if(action!=='flip')e.stopPropagation();
 switch(action){
 case 'tab':changeTab(btn.dataset.value);break;
 case 'level':changeLevel(btn.dataset.value);break;
 case 'flip':flipped=!flipped;render();break;
 case 'bookmark':toggleId('bookmarkedIds',btn.dataset.id);break;
 case 'learned':toggleId('learnedIds',btn.dataset.id);break;
 case 'speak':{const w=current();if(w)speak(btn.dataset.text==='example'?w.example:w.word);break;}
 case 'prev':go(-1);break;
 case 'next':go(1);break;
 case 'shuffle':randomCard();break;
 case 'autoplay':togglePlay();break;
 case 'quiz-answer':answerQuiz(Number(btn.dataset.index));break;
 case 'quiz-reset':quizScore=0;quizCount=0;prepareQuiz();render();break;
 case 'review-wrong':changeLevel('WRONG');changeTab('quiz');break;
 case 'export':exportData();break;
 case 'import':openImport();break;
 case 'add':openEditor(null);break;
 case 'edit-current':{const w=current();if(w)openEditor(w.id);break;}
 case 'delete-current':{const w=current();if(w)deleteWord(w.id);break;}
 case 'reset-words':resetWords();break;
 case 'settings':modal='settings';stopPlay();render();break;
 case 'generate-modal':modal='generate';stopPlay();render();break;
 case 'close-modal':closeModal();break;
 case 'test-ai':testAIConnection();break;
 case 'save-settings':{const input=$('#apikey-input').value.trim();if(input)apiKey=input;aiModel=$('#model-input').value;aiFallback=Boolean($('#fallback-input')?.checked);modal=pendingModal||null;pendingModal=null;render();notify(apiKey?'已啟用本次頁面的金鑰。':'未設定 AI Key，基本功能仍可使用。');break;}
 case 'forget-key':apiKey='';modal=null;render();notify('已清除本次頁面的金鑰。');break;
 case 'bulk':bulkGenerate();break;
 case 'generate':topicGenerate();break;
 case 'auto-fill':autoFill();break;
 case 'analyze':analyze();break;
 }
});
document.addEventListener('submit',e=>{if(e.target.id==='word-form'){e.preventDefault();saveWord();}});
document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;if(composingSearch)return;const start=e.target.selectionStart,end=e.target.selectionEnd;render();const field=$('#search');field?.focus();try{field?.setSelectionRange(start,end);}catch{}}else if(e.target.id==='sentence-input'){sentence=e.target.value;}else if(e.target.id==='generate-custom-topic'){genCustomTopic=e.target.value;}});
document.addEventListener('compositionstart',e=>{if(e.target.id==='search')composingSearch=true;});
document.addEventListener('compositionend',e=>{if(e.target.id==='search'){composingSearch=false;search=e.target.value;render();$('#search')?.focus();}});
document.addEventListener('change',e=>{if(e.target.id==='import-file')importData(e.target.files[0]);else if(e.target.id==='generate-topic'){genTopic=e.target.value;const custom=genTopic==='__custom__';$('#generate-custom-group')?.classList.toggle('hidden',!custom);if(custom)$('#generate-custom-topic')?.focus();}else if(e.target.id==='generate-level')genLevel=e.target.value;});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&modal){closeModal();return;}
 const inField=e.target.matches('input,textarea,select,[contenteditable]');if(modal||inField||tab!=='card')return;
 if(e.key==='ArrowRight'){e.preventDefault();go(1);}else if(e.key==='ArrowLeft'){e.preventDefault();go(-1);}else if(e.code==='Space'){e.preventDefault();flipped=!flipped;render();}
});
render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err =>
      console.warn('Service Worker 註冊失敗：', err));
  });
}
